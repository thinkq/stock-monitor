[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-movement-monitor"
version = "0.1.0"
description = "Binance Futures price movement alerts; no trading"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "numpy>=1.26,<3", "pandas>=2.2,<4", "TA-Lib>=0.6.5,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
market-monitor = "market_monitor.app:main"
market-monitor-hermes = "market_monitor.hermes:main"
mm = "market_monitor.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
