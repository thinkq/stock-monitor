# 所有阈值均为初始经验参数，未经最优性验证；启动时检查全部标的。
symbols = ["BTCUSDT", "SOXLUSDT", "NVDAUSDT", "AVGOUSDT", "INTCUSDT", "AMDUSDT", "MUUSDT", "SNDKUSDT", "MRVLUSDT", "CRDOUSDT", "DELLUSDT", "MSFTUSDT", "APPUSDT"]
interval = "15m"
scan_seconds = 60
history_bars = 200
max_data_age_seconds = 180
base_url = "https://fapi.binance.com"
# 本机直连 Binance 正常时保持 false（每次 cron 运行都省掉一次 DoH + TLS）。
# 若直连再次出现 DNS 解析异常，改回 true 作为应用内 DoH 兜底。
dns_over_https = false
database = "data/monitor.sqlite3"
timezone = "Asia/Shanghai"
directions = ["up", "down"]
cooldown_seconds = 3600
daily_limit = 30
reset_bars = 2
# 快速信号须在相邻有效扫描中持续满足至少 60 秒；0 可关闭确认。
fast_confirmation_seconds = 60

[detection]
# 越小越灵敏：同时缩放百分比与 ATR 阈值，建议先用 1.0。
sensitivity = 1.0
atr_period = 14
adx_period = 14
fast_15_pct = 1.5
fast_30_pct = 2.0
fast_atr = 2.0
fast_er_min = 0.65
sustained_pct = 2.0
sustained_atr = 2.0
# er_min 已删除：count=2 窗口下 ER 恒为 1.0，170 个历史候选从未被它拦下。
# 旧 config.local.toml 里若仍有该键，程序仍可加载（字段保留兼容），但不参与判定。
pullback_atr = 0.35
quiet_pct = 0.5
quiet_er = 0.35

[telegram]
enabled = false
# 凭证只从环境变量读取，不写入源码或 SQLite。
token_env = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"
