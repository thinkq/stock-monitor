# 所有阈值均为初始经验参数，未经最优性验证；启动时检查全部标的。
symbols = ["BTCUSDT", "SOXLUSDT", "NVDAUSDT", "AVGOUSDT", "INTCUSDT", "AMDUSDT", "MUUSDT", "SNDKUSDT", "MRVLUSDT", "CRDOUSDT", "DELLUSDT", "MSFTUSDT", "APPUSDT"]
interval = "15m"
scan_seconds = 60
history_bars = 200
max_data_age_seconds = 180
base_url = "https://fapi.binance.com"
# 本机直连 Binance 正常时保持 false（每次 cron 运行都省掉一次 DoH + TLS）。
# 若直连再次出现 DNS 解析异常，改回 true 作为应用内 DoH 兜底。
dns_over_https = false
database = "data/monitor.sqlite3"
timezone = "Asia/Shanghai"
directions = ["up", "down"]
cooldown_seconds = 3600
# 首报每日上限。11-06 那样的一整波半导体抛压实测 30 条刚好顶满，
# 顶满后当天剩余时间全部 suppressed 且不再补发，因此放宽到 60。
daily_limit = 60
reset_bars = 2
# 快速信号须在相邻有效扫描中持续满足至少 60 秒；0 可关闭确认。
fast_confirmation_seconds = 60
# 同一轮扫描里同方向报警 ≥ 这个数量就合并成一条"板块级"消息（0 或 1 = 不合并）。
# 数据库仍按标的逐条记录，冷却/日限/去重语义不变，只是推送不刷屏。
merge_min_symbols = 3
# 同一波行情里，若位移（相对事件起点）比上次播报再扩大 1.5 倍 ATR、且相隔 30 分钟，
# 补一条"升级"提醒。设 0 关闭。实测代价：29 条首报只多 6 条，单事件最多 2 条。
escalation_atr = 1.5
escalation_seconds = 1800
# 升级提醒自己的每日配额，不占首报额度；0 = 不发升级。
escalation_daily_limit = 20
# 连续多少轮扫描不完整就推一条"监控异常"；0 关闭心跳。
health_alert_rounds = 3
health_alert_seconds = 1800
# 每天自动清理一次超过这个天数的告警；0 关闭（仍可手动 mm prune）。
retention_days = 180

[detection]
# 所有阈值都是绝对值，没有全局"灵敏度"系数（旧 sensitivity 与逐项调参在数学上重复，已删除；
# 旧 config.local.toml 里若仍有 sensitivity / er_min，程序照常加载但不生效）。
atr_period = 14
adx_period = 14
fast_15_pct = 1.5
fast_30_pct = 2.0
fast_atr = 2.0
fast_er_min = 0.65
sustained_pct = 2.0
sustained_atr = 2.0
# sustained 不再校验 ER：count=2 窗口下 ER 恒为 1.0，170 个历史候选 0 条被它拦下。
pullback_atr = 0.35
quiet_pct = 0.5
quiet_er = 0.35

[telegram]
enabled = false
# 凭证只从环境变量读取，不写入源码或 SQLite。
token_env = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"
